<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Live Concert Generator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <article class="ticket">

    <header class="poster">
      <p class="presents">Love Live Concert Generator</p>
      <h1 class="billing" id="billing"></h1>
      <p class="where-when" id="where-when"></p>
    </header>

    <p class="status" id="status"></p>

    <section class="order">
      <h2>Your order</h2>

      <p class="line" id="price-line"></p>
      <p class="line" id="fee-line"></p>

      <p class="total">
        <span>Total</span>
        <strong id="total"></strong>
      </p>

      <p class="fine-print" id="fine-print"></p>
    </section>

    <section class="lineup-wrap">
      <h2>Running order</h2>
      <ul class="lineup" id="lineup"></ul>
      <p class="tagline" id="tagline"></p>
    </section>

  </article>

  <script>


    const groups = [
      {
        name: "μ's",
        song: 'Snow halation',
        venue: 'Tokyo Dome',
        date: 'November 13'
      },
      {
        name: 'Aqours',
        song: 'Aozora Jumping Heart',
        venue: 'Saitama Super Arena',
        date: 'November 20'
      },
      {
        name: 'Nijigasaki',
        song: 'TOKIMEKI Runners',
        venue: 'Yokohama Arena',
        date: 'December 5'
      },
      {
        name: 'Liella!',
        song: 'START!! True dreams',
        venue: 'Osaka Arena',
        date: 'December 12'
      }
    ]

    const members = [
      'Honoka',
      'Chika',
      'Ayumu'
    ]

    const colours = [
      '#e88ba8',
      '#69b7d6'
    ]


    function pickRandom(array) {
      return array[Math.floor(Math.random() * array.length)]
    }

    function randomBetween(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min
    }



    const group = pickRandom(groups)
    const member = pickRandom(members)

    const ticketPrice = randomBetween(30, 80)
    const quantity = randomBetween(1, 4)
    const ticketsLeft = randomBetween(0, 20)



    const subtotal = ticketPrice * quantity
    const serviceFee = subtotal * 0.10
    const total = subtotal + serviceFee



    const isSoldOut = ticketsLeft === 0
    const isAlmostSoldOut = ticketsLeft > 0 && ticketsLeft < 10



    let status

    if (isSoldOut) {
      status = 'Sold out!'
    } else if (isAlmostSoldOut) {
      status = `Only ${ticketsLeft} tickets left!`
    } else {
      status = 'Tickets available!'
    }



    const bookingMessage = quantity > 2
      ? 'Group booking!'
      : 'Regular booking!'


    const billing = `${group.name} LIVE CONCERT`
    const whereWhen = `${group.venue} · ${group.date}`



    document.body.style.setProperty('--accent', pickRandom(colours))



    document.querySelector('#billing').textContent = billing
    document.querySelector('#where-when').textContent = whereWhen
    document.querySelector('#status').textContent = status

    document.querySelector('#price-line').textContent =
      `${quantity} × $${ticketPrice.toFixed(2)} = $${subtotal.toFixed(2)}`

    document.querySelector('#fee-line').textContent =
      `Service fee = $${serviceFee.toFixed(2)}`

    document.querySelector('#total').textContent =
      `$${total.toFixed(2)}`

    document.querySelector('#fine-print').textContent =
      `${member} is performing! ${bookingMessage}`



    const lineup = [
      'Opening Performance',
      group.song,
      `${member} Solo Performance`,
      'Special Performance',
      'Final Performance'
    ]

    const lineupElement = document.querySelector('#lineup')

    lineupElement.innerHTML = ''

    for (let i = 0; i < lineup.length; i++) {

      const stripe = i % 2 === 0 ? 'stripe' : ''

      lineupElement.innerHTML += `
        <li class="${stripe}">
          ${lineup[i]}
        </li>
      `
    }


    document.querySelector('#tagline').textContent =
      `Enjoy ${group.name} at ${group.venue}!`

  </script>

</body>
</html>
