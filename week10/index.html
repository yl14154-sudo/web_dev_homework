<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Live Concert Generator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <article class="ticket">

    <header class="poster">
      <p class="presents">Love Live Concert Generator</p>
      <h1 class="billing" id="billing"></h1>
      <p class="where-when" id="where-when"></p>
    </header>

    <p class="status" id="status"></p>

    <section class="order">
      <h2>Your order</h2>

      <label class="guest-label" for="guest-name">Your name</label>
      <input class="guest-name" id="guest-name" type="text" placeholder="Type your name" />

      <div class="controls">
        <div class="stepper">
          <button id="minus" type="button">−</button>
          <span id="quantity"></span>
          <button id="plus" type="button">+</button>
        </div>
        <button class="regenerate" id="regenerate" type="button">New concert</button>
      </div>

      <p class="line" id="price-line"></p>
      <p class="line" id="fee-line"></p>

      <p class="total">
        <span>Total</span>
        <strong id="total"></strong>
      </p>

      <p class="fine-print" id="fine-print"></p>
    </section>

    <section class="lineup-wrap">
      <h2>Running order</h2>
      <ul class="lineup" id="lineup"></ul>
      <p class="tagline" id="tagline"></p>
    </section>

    <section class="details-wrap">
      <h2>Show details</h2>
      <dl class="details" id="details"></dl>
      <button class="clear-saved" id="clear-saved" type="button">Clear saved show</button>
    </section>

  </article>

  <script>
    // JSON.stringify removes methods from an object, so a saved show comes back without its methods; I saw that calling the method after JSON.parse caused an error because JSON stores data but not functions, so I reattach the methods when I load the show.
    const shows = [
      {
        name: "μ's",
        song: 'Snow halation',
        venue: 'Tokyo Dome',
        date: 'November 13',
        ticketPrice: 58,
        ticketsLeft: 12,
        isIndoor: true,
        accent: '#e88ba8',
        featuredMember: 'Honoka',
        lineup: ['Opening Performance', 'Snow halation', 'Honoka Solo Performance', 'Special Performance', 'Final Performance'],
        serviceFee(subtotal) {
          return subtotal * 0.1
        },
        statusMessage() {
          if (this.ticketsLeft === 0) return 'Sold out!'
          if (this.ticketsLeft < 10) return `Only ${this.ticketsLeft} tickets left!`
          return 'Tickets available!'
        }
      },
      {
        name: 'Aqours',
        song: 'Aozora Jumping Heart',
        venue: 'Saitama Super Arena',
        date: 'November 20',
        ticketPrice: 46,
        ticketsLeft: 7,
        isIndoor: true,
        accent: '#69b7d6',
        featuredMember: 'Chika',
        lineup: ['Opening Performance', 'Aozora Jumping Heart', 'Chika Solo Performance', 'Special Performance', 'Final Performance'],
        serviceFee(subtotal) {
          return subtotal * 0.1
        },
        statusMessage() {
          if (this.ticketsLeft === 0) return 'Sold out!'
          if (this.ticketsLeft < 10) return `Only ${this.ticketsLeft} tickets left!`
          return 'Tickets available!'
        }
      },
      {
        name: 'Nijigasaki',
        song: 'TOKIMEKI Runners',
        venue: 'Yokohama Arena',
        date: 'December 5',
        ticketPrice: 39,
        ticketsLeft: 18,
        isIndoor: true,
        accent: '#f1a55b',
        featuredMember: 'Ayumu',
        lineup: ['Opening Performance', 'TOKIMEKI Runners', 'Ayumu Solo Performance', 'Special Performance', 'Final Performance'],
        serviceFee(subtotal) {
          return subtotal * 0.1
        },
        statusMessage() {
          if (this.ticketsLeft === 0) return 'Sold out!'
          if (this.ticketsLeft < 10) return `Only ${this.ticketsLeft} tickets left!`
          return 'Tickets available!'
        }
      },
      {
        name: 'Liella!',
        song: 'START!! True dreams',
        venue: 'Osaka Arena',
        date: 'December 12',
        ticketPrice: 52,
        ticketsLeft: 4,
        isIndoor: true,
        accent: '#9b83d5',
        featuredMember: 'Kanon',
        lineup: ['Opening Performance', 'START!! True dreams', 'Kanon Solo Performance', 'Special Performance', 'Final Performance'],
        serviceFee(subtotal) {
          return subtotal * 0.1
        },
        statusMessage() {
          if (this.ticketsLeft === 0) return 'Sold out!'
          if (this.ticketsLeft < 10) return `Only ${this.ticketsLeft} tickets left!`
          return 'Tickets available!'
        }
      },
      {
        name: 'Hasunosora',
        song: 'On your mark',
        venue: 'Kobe World Hall',
        date: 'December 19',
        ticketPrice: 43,
        ticketsLeft: 0,
        isIndoor: true,
        accent: '#7cbf9e',
        featuredMember: 'Kozue',
        lineup: ['Opening Performance', 'On your mark', 'Kozue Solo Performance', 'Special Performance', 'Final Performance'],
        serviceFee(subtotal) {
          return subtotal * 0.1
        },
        statusMessage() {
          if (this.ticketsLeft === 0) return 'Sold out!'
          if (this.ticketsLeft < 10) return `Only ${this.ticketsLeft} tickets left!`
          return 'Tickets available!'
        }
      }
    ]

    function pickRandom(array) {
      return array[Math.floor(Math.random() * array.length)]
    }

    function restoreMethods(savedShow) {
      savedShow.serviceFee = function (subtotal) {
        return subtotal * 0.1
      }
      savedShow.statusMessage = function () {
        if (this.ticketsLeft === 0) return 'Sold out!'
        if (this.ticketsLeft < 10) return `Only ${this.ticketsLeft} tickets left!`
        return 'Tickets available!'
      }
      return savedShow
    }

    function loadSavedShow() {
      const rawShow = localStorage.getItem('show')
      if (!rawShow) return null
      return restoreMethods(JSON.parse(rawShow))
    }

    let show = loadSavedShow() || pickRandom(shows)
    let quantity = show.ticketsLeft === 0 ? 0 : 1
    let guestName = ''

    const billingElement = document.querySelector('#billing')
    const whereWhenElement = document.querySelector('#where-when')
    const statusElement = document.querySelector('#status')
    const priceLineElement = document.querySelector('#price-line')
    const feeLineElement = document.querySelector('#fee-line')
    const totalElement = document.querySelector('#total')
    const finePrintElement = document.querySelector('#fine-print')
    const lineupElement = document.querySelector('#lineup')
    const taglineElement = document.querySelector('#tagline')
    const detailsElement = document.querySelector('#details')
    const quantityElement = document.querySelector('#quantity')
    const guestNameElement = document.querySelector('#guest-name')
    const minusButton = document.querySelector('#minus')
    const plusButton = document.querySelector('#plus')

    function render() {
      const subtotal = show.ticketPrice * quantity
      const serviceFee = show.serviceFee(subtotal)
      const bookingMessage = quantity > 2 ? 'Group booking!' : 'Regular booking!'
      document.body.style.setProperty('--accent', show.accent)
      billingElement.textContent = `${show.name} LIVE CONCERT`
      whereWhenElement.textContent = `${show.venue} · ${show.date}`
      statusElement.textContent = show.statusMessage()
      quantityElement.textContent = show.ticketsLeft === 0 ? '0' : quantity
      priceLineElement.textContent = `${quantity} × $${show.ticketPrice.toFixed(2)} = $${subtotal.toFixed(2)}`
      feeLineElement.textContent = `Service fee = $${show.serviceFee(subtotal).toFixed(2)}`
      totalElement.textContent = `$${(show.ticketPrice * quantity + serviceFee).toFixed(2)}`
      finePrintElement.textContent = `${guestName || show.featuredMember} is performing! ${bookingMessage}`
      guestNameElement.value = guestName
      minusButton.disabled = quantity === 0
      plusButton.disabled = quantity >= Math.min(4, show.ticketsLeft)

      lineupElement.innerHTML = ''

      for (let i = 0; i < show.lineup.length; i++) {
        const stripe = i % 2 === 0 ? 'stripe' : ''
        lineupElement.innerHTML += `<li class="${stripe}">${show.lineup[i]}</li>`
      }

      taglineElement.textContent = `Enjoy ${show.name} at ${show.venue}!`

      detailsElement.innerHTML = ''
      const keys = Object.keys(show)

      for (let i = 0; i < keys.length; i++) {
        const key = keys[i]
        if (typeof show[key] === 'function') continue
        const label = document.createElement('dt')
        const value = document.createElement('dd')
        label.textContent = key
        value.textContent = Array.isArray(show[key]) ? show[key].join(', ') : String(show[key])
        detailsElement.append(label, value)
      }
    }

    minusButton.addEventListener('click', function () {
      if (quantity > 0) {
        quantity--
        render()
      }
    })

    plusButton.addEventListener('click', function () {
      if (quantity < Math.min(4, show.ticketsLeft)) {
        quantity++
        render()
      }
    })

    document.querySelector('#regenerate').addEventListener('click', function () {
      show = pickRandom(shows)
      quantity = show.ticketsLeft === 0 ? 0 : 1
      localStorage.setItem('show', JSON.stringify(show))
      render()
    })

    document.querySelector('#clear-saved').addEventListener('click', function () {
      localStorage.removeItem('show')
      show = pickRandom(shows)
      quantity = show.ticketsLeft === 0 ? 0 : 1
      render()
    })

    guestNameElement.addEventListener('input', function (event) {
      guestName = event.target.value
      render()
    })

    render()

  </script>

</body>
</html>
